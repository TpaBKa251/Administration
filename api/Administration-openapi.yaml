openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8083
  description: Generated server url
paths:
  /documents:
    post:
      tags:
      - document-controller
      operationId: addDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseDto"
  /balance:
    post:
      tags:
      - balance-controller
      operationId: addBalance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponseDto"
  /documents/edit:

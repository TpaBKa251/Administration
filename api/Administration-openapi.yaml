      operationId: getAllBalances
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1000000000
      - name: negative
        in: query
        required: false
        schema:
          type: boolean
      - name: value
        in: query
        required: false
        schema:
          type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:

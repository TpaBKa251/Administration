      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceResponseDto"
components:
  schemas:
    DocumentRequestDto:
      type: object
      properties:
        user:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - CERTIFICATE
          - FLUOROGRAPHY
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - endDate
      - startDate
      - type
      - user
    DocumentResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - CERTIFICATE
          - FLUOROGRAPHY
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    BalanceRequestDto:
      type: object
      properties:
        user:
          type: string
          format: uuid
        balance:
          type: number
      required:
      - balance
      - user
    BalanceResponseDto:
      type: object
      properties:
        user:
          type: string
          format: uuid
        balance:
          type: number
    DocumentEditRequestDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - endDate
      - id
      - startDate
    BalanceShortResponseDto:
      type: object
      properties:
        balance:
          type: number

  /documents/get/all:
    get:
      tags:
      - document-controller
      operationId: getAllDocuments
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1000000000
      - name: fluraPast
        in: query
        required: false
        schema:
          type: boolean
      - name: fluraDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: certPast
        in: query
        required: false
        schema:
          type: boolean
      - name: certDate
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            application/json:

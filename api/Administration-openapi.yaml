      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponseDto"
  /documents/get/type/{documentType}/user/{userId}:
    get:
      tags:
      - document-controller
      operationId: getDocumentByType
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentType
        in: path
        required: true
        schema:
          type: string
          enum:
          - CERTIFICATE
          - FLUOROGRAPHY
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
